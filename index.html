<!-- ==================== TRANG INTRO NGHỆ THUẬT & PHÒNG THỦ CHIẾN THUẬT ==================== -->
<section id="welcomeScreen">
    <!-- Bầu trời chuyển phổ Nóng -> Lạnh & Thiên thể ở phía xa -->
    <div class="sky-horizon-backdrop"></div>
    <div class="distant-celestial" id="distantCelestial"></div>

    <!-- Không gian trình diễn Logo & Lực lượng tuần tra -->
    <div class="tactical-stage">
        <!-- Luồng sáng nhiệt giảm dần: Trắng -> Vàng nhạt -> Vàng đậm -->
        <div class="thermal-light-cone" id="thermalLightCone"></div>

        <!-- Đội bay UAV tuần tra xung quanh trên không -->
        <div class="uav-orbit uav-1" title="UAV Trinh sát 01">
            <svg width="26" height="14" viewBox="0 0 26 14" fill="none">
                <path d="M13 2L25 8L13 11L1 8L13 2Z" fill="#94a3b8" stroke="#38bdf8" stroke-width="1"/>
                <circle cx="13" cy="7" r="1.5" fill="#f43f5e"/>
            </svg>
        </div>
        <div class="uav-orbit uav-2" title="UAV Trinh sát 02">
            <svg width="22" height="12" viewBox="0 0 26 14" fill="none">
                <path d="M13 2L25 8L13 11L1 8L13 2Z" fill="#cbd5e1" stroke="#fbbf24" stroke-width="1"/>
                <circle cx="13" cy="7" r="1.5" fill="#10b981"/>
            </svg>
        </div>

        <!-- Logo Khiên bay vào & Hóa cứng ánh kim -->
        <div class="shield-emblem kinetic-entry" id="heroShield">
            <svg width="112" height="124" viewBox="0 0 100 112" fill="none">
                <defs>
                    <linearGradient id="shieldGrad" x1="10" y1="5" x2="90" y2="105" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="50%" stop-color="#1e293b"/>
                        <stop offset="100%" stop-color="#090d16"/>
                    </linearGradient>
                    <linearGradient id="shieldBorder" x1="0" y1="0" x2="100" y2="112" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="45%" stop-color="#fde047"/>
                        <stop offset="100%" stop-color="#d97706"/>
                    </linearGradient>
                </defs>
                <path d="M50 4L10 20V52C10 79.5 27.1 103.8 50 109C72.9 103.8 90 79.5 90 52V20L50 4Z" fill="url(#shieldGrad)" stroke="url(#shieldBorder)" stroke-width="4.5"/>
                <path d="M50 26C42.8 26 37 31.8 37 39V45H63V39C63 31.8 57.2 26 50 26Z" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
                <rect x="31" y="45" width="38" height="30" rx="6" fill="#0f172a" stroke="#fde047" stroke-width="3"/>
                <circle cx="50" cy="58" r="4" fill="#fde047"/>
                <path d="M50 62V68" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div class="metallic-sheen"></div>
        </div>

        <!-- Bóng đổ phối cảnh theo luật gần xa của mỹ thuật -->
        <div class="perspective-ground-shadow" id="perspectiveShadow"></div>

        <!-- Tuyến phòng thủ mặt đất với các xe tăng tí hon di chuyển -->
        <div class="ground-patrol-line">
            <div class="mini-tank tank-left">
                <svg width="34" height="16" viewBox="0 0 34 16" fill="none">
                    <rect x="12" y="3" width="11" height="5" rx="1.5" fill="#475569"/>
                    <line x1="23" y1="5.5" x2="32" y2="4.5" stroke="#94a3b8" stroke-width="2"/>
                    <path d="M4 8H28L31 12H2L4 8Z" fill="#334155" stroke="#fbbf24" stroke-width="0.8"/>
                    <rect x="3" y="12" width="27" height="3.5" rx="1.7" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
                </svg>
            </div>
            <div class="mini-tank tank-right">
                <svg width="30" height="14" viewBox="0 0 34 16" fill="none">
                    <rect x="11" y="3" width="11" height="5" rx="1.5" fill="#475569"/>
                    <line x1="2" y1="4.5" x2="11" y2="5.5" stroke="#94a3b8" stroke-width="2"/>
                    <path d="M6 8H30L32 12H3L6 8Z" fill="#334155" stroke="#38bdf8" stroke-width="0.8"/>
                    <rect x="4" y="12" width="27" height="3.5" rx="1.7" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="live-badge" id="welcomeStatusPill">⏱️ Đang đồng bộ bầu trời...</div>
    <h1>CyberGuard AI</h1>
    <p>Hệ thống Phòng vệ An toàn Thông tin & Trợ lý AI Đa hình thái.</p>
    <button class="btn-primary" onclick="startSystem()">🚀 Bắt đầu</button>
</section>
